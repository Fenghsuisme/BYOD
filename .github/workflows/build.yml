name: Build (Linux)

# 驗證編譯與單元測試（考試碟部署採「整碟複製」，不在 CI 產出成品）。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test (Core)
        run: dotnet test tests/ByodKioskBrowser.Tests/ByodKioskBrowser.Tests.csproj -c Release

      - name: Fetch Monaco
        run: ./Scripts/fetch-monaco.sh

      - name: Build App
        run: dotnet build App/ByodKioskBrowser.App.csproj -c Release
