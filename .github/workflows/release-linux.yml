name: Release (Linux x64)

# 每次推到 main 自動建好 Linux 考試機成品，放到 Release「linux-latest」。
# 考試機的 setup-exam.sh 直接下載這個成品，不必安裝 .NET SDK、不必抓 NuGet、不必建置。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

# 不取消進行中的上傳（取消在上傳一半會讓考試機抓不到檔案）；連續 push 時排隊依序跑
concurrency:
  group: release-linux
  cancel-in-progress: false

jobs:
  release:
    # 固定版本：ubuntu-latest 會被 GitHub 換成 26.04，建置環境不該隨之變動
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch Monaco / pdf.js
        run: |
          ./Scripts/fetch-monaco.sh
          ./Scripts/fetch-pdfjs.sh

      - name: Publish (self-contained，考試機不需 .NET)
        run: dotnet publish App/ByodKioskBrowser.App.csproj -c Release -r linux-x64 --self-contained true -o publish

      - name: Trim
        run: |
          # CEF 介面語系只留英文與繁中；除錯符號檔用不到
          find publish -path '*/locales/*.pak' ! -name 'en-US.pak' ! -name 'zh-TW.pak' -delete
          find publish -name '*.pdb' -delete
          echo "$GITHUB_SHA" > publish/BUILD_COMMIT

      - name: Package
        run: tar -czf byod-linux-x64.tar.gz -C publish .

      - name: Upload to release linux-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 不刪除 Release（刪掉到重建之間考試機會 404），而是在既有 Release 上增補檔案。
          # 順序：帶版本號的成品 → 固定檔名成品（舊版腳本用）→ BUILD_COMMIT 最後上傳。
          # 考試機先讀 BUILD_COMMIT 再抓對應版本號的檔案，因此永遠不會抓到上傳到一半的成品。
          gh release view linux-latest >/dev/null 2>&1 || \
            gh release create linux-latest --target "$GITHUB_SHA" \
              --title "Linux x64（最新）" \
              --notes "自動建置。考試機由 Scripts/setup-exam.sh / fetch-release.sh 下載使用。"
          cp byod-linux-x64.tar.gz "byod-linux-x64-$GITHUB_SHA.tar.gz"
          cp publish/BUILD_COMMIT BUILD_COMMIT
          gh release upload linux-latest "byod-linux-x64-$GITHUB_SHA.tar.gz" --clobber
          gh release upload linux-latest byod-linux-x64.tar.gz --clobber
          gh release upload linux-latest BUILD_COMMIT --clobber
          gh release edit linux-latest --notes "自動建置自 ${GITHUB_SHA}。考試機由 Scripts/setup-exam.sh / fetch-release.sh 下載使用。"
          # 帶版本號的成品只留最新 3 個（較舊的不會再有人下載）
          gh release view linux-latest --json assets \
            -q '[.assets[] | select(.name | test("^byod-linux-x64-[0-9a-f]{40}\\.tar\\.gz$"))] | sort_by(.createdAt) | reverse | .[3:][] | .name' \
            | while read -r old; do gh release delete-asset linux-latest "$old" --yes; done
