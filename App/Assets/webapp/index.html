<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self';" />
    <title>本地程式碼編輯器</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="toolbar">
        <span id="lang-label">語言：</span>
        <select id="language-select">
            <option value="cpp">C++</option>
            <option value="c">C</option>
        </select>
        <button id="run-btn" title="Ctrl+Enter">▶ 執行</button>
        <span id="run-status"></span>
        <span id="status">編輯器離線模式（本地資源）</span>
    </div>

    <div id="tabbar">
        <div id="tabs"></div>
        <button id="new-tab" title="新增分頁">＋</button>
    </div>

    <div id="editor"></div>

    <div id="runner">
        <div class="io-col">
            <div class="io-label">輸入 (stdin)</div>
            <textarea id="stdin" spellcheck="false" placeholder="在此貼上測資，執行時作為程式的標準輸入"></textarea>
        </div>
        <div class="io-col">
            <div class="io-label">輸出</div>
            <pre id="output"></pre>
        </div>
    </div>

    <div id="fallback" class="hidden">
        <h2>尚未安裝 Monaco Editor 本地資源</h2>
        <p>請執行 <code>./Scripts/fetch-monaco.sh</code>（或 Windows 的 <code>fetch-monaco.ps1</code>），
           將 Monaco 的 <code>min/vs</code> 放到 <code>App/Assets/webapp/vs</code>，再重新建置。</p>
    </div>

    <script src="vs/loader.js" onerror="window.__monacoLoadFailed = true"></script>
    <script src="app.js"></script>
</body>
</html>
