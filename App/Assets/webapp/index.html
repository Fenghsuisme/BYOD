<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self';" />
    <title>本地程式碼編輯器</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="toolbar">
        <div id="lang-dropdown">
            <button id="lang-btn" type="button"><span class="lang-txt">C++</span> <span class="lang-arrow">▾</span></button>
            <div id="lang-menu" class="hidden">
                <div class="lang-opt" data-val="cpp">C++</div>
                <div class="lang-opt" data-val="c">C</div>
                <div class="lang-opt" data-val="h">Header (.h)</div>
            </div>
        </div>
        <button id="run-btn" title="Ctrl+Enter">▶ 執行</button>
        <button id="dl-btn" class="ref-btn" title="儲存所有分頁至桌面（依日期資料夾）">⬇ 下載</button>
        <span id="run-status"></span>
        <span id="status">編輯器離線模式（本地資源）</span>
    </div>

    <div id="blockbar">
        <div id="block-list"></div>
        <button id="new-block" title="新增大題">＋ 大題</button>
    </div>

    <div id="tabbar">
        <div id="tabs"></div>
        <button id="new-tab" title="新增分頁">＋</button>
    </div>

    <div id="editor"></div>

    <div id="v-splitter" title="拖曳調整 編輯器 / 輸出區 高度"></div>

    <div id="runner">
        <div class="io-col" id="stdin-col">
            <div class="io-label">輸入 (stdin)
                <span id="stdin-actions" class="hidden">
                    <button id="send-btn" type="button" title="Enter">送出 ⏎</button>
                    <button id="eof-btn" type="button" title="結束輸入（讓 while(cin>>x) 之類的迴圈結束）">EOF</button>
                </span>
            </div>
            <textarea id="stdin" spellcheck="false" placeholder="可先貼上測資再按執行；或留空直接執行，程式執行時再於此輸入（Enter 送出、Shift+Enter 換行）"></textarea>
        </div>
        <div id="h-splitter" title="拖曳調整 輸入 / 輸出 寬度"></div>
        <div class="io-col" id="output-col">
            <div class="io-label">輸出</div>
            <pre id="output"></pre>
        </div>
    </div>

    <div id="fallback" class="hidden">
        <h2>尚未安裝 Monaco Editor 本地資源</h2>
        <p>請執行 <code>./Scripts/fetch-monaco.sh</code>（或 Windows 的 <code>fetch-monaco.ps1</code>），
           將 Monaco 的 <code>min/vs</code> 放到 <code>App/Assets/webapp/vs</code>，再重新建置。</p>
    </div>

    <script src="vs/loader.js" onerror="window.__monacoLoadFailed = true"></script>
    <script src="app.js"></script>
</body>
</html>
