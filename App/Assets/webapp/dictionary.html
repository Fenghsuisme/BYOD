<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>English-Chinese Dictionary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1e1e1e;color:#d4d4d4;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;font-size:13px}
body{display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:40px;flex-shrink:0;background:#252526;border-bottom:1px solid #3e3e42}
#topbar a{color:#9cdcfe;text-decoration:none;font-size:12px;padding:3px 8px;border:1px solid #3e3e42;border-radius:4px}
#topbar a:hover{background:#2d2d30}
#topbar-title{font-weight:600;color:#dcdcaa;font-size:13px;white-space:nowrap}
#search-box{margin-left:auto;background:#2d2d30;color:#d4d4d4;border:1px solid #3e3e42;border-radius:4px;padding:4px 10px;font-size:12px;width:260px;outline:none}
#search-box:focus{border-color:#0e639c}
#search-box::placeholder{color:#555}
#search-box:disabled{opacity:.4;cursor:not-allowed}
#alpha-bar{display:flex;flex-wrap:wrap;gap:2px;padding:5px 10px;background:#252526;border-bottom:1px solid #3e3e42;flex-shrink:0}
.alpha-btn{background:#2d2d30;color:#9cdcfe;border:1px solid #3e3e42;border-radius:3px;padding:2px 7px;font-size:11px;cursor:pointer;flex-shrink:0}
.alpha-btn:hover,.alpha-btn.active{background:#0e639c;color:#fff;border-color:#0e639c}
#content-wrap{flex:1;position:relative;overflow:hidden}
#content{height:100%;overflow-y:auto;padding:6px 14px 24px;scrollbar-width:thin;scrollbar-color:#3e3e42 transparent}
#content::-webkit-scrollbar{width:6px}
#content::-webkit-scrollbar-thumb{background:#3e3e42;border-radius:3px}
.letter-group{margin-bottom:14px}
.letter-title{font-size:11px;font-weight:700;color:#6ca8d4;text-transform:uppercase;letter-spacing:1px;padding:4px 0 5px;border-bottom:1px solid #2d2d30;margin-bottom:3px;position:sticky;top:0;background:#1e1e1e;z-index:1}
.word-row{display:flex;align-items:baseline;padding:2px 4px;border-radius:3px;gap:0}
.word-row:hover{background:#252526}
.word-en{color:#9cdcfe;font-size:12.5px;font-weight:500;min-width:190px;flex-shrink:0}
.word-ph{color:#569cd6;font-size:11px;min-width:130px;flex-shrink:0;font-style:italic}
.word-zh{color:#a8a8a8;font-size:12px;line-height:1.4}
#overlay{position:absolute;inset:0;background:#1e1e1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10}
#load-msg{color:#9cdcfe;font-size:14px}
#load-bar-wrap{width:320px;height:6px;background:#2d2d30;border-radius:3px;overflow:hidden}
#load-bar{height:100%;width:0%;background:#0e639c;border-radius:3px;transition:width .15s}
#load-sub{color:#666;font-size:11px}
.hidden{display:none!important}
#result-count{color:#666;font-size:11px;padding:0 0 4px}
</style>
</head>
<body>
<div id="topbar">
  <a href="javascript:history.back()">← 返回</a>
  <span id="topbar-title">English-Chinese Dictionary</span>
  <input id="search-box" type="text" placeholder="Search English or Chinese…" autocomplete="off" disabled/>
</div>
<div id="alpha-bar">
  <button class="alpha-btn active" data-l="ALL">All</button>
</div>
<div id="content-wrap">
  <div id="content"></div>
  <div id="overlay">
    <div id="load-msg">載入字典資料…</div>
    <div id="load-bar-wrap"><div id="load-bar"></div></div>
    <div id="load-sub">767,532 筆詞條，請稍候</div>
  </div>
</div>
<script>
let WORDS = [];         // sorted [[word, phonetic, zh], ...]
let wordMap = null;     // Map<lower, index> for exact O(1) lookup
let letters = [];
let currentLetter = 'ALL';

const searchBox = document.getElementById('search-box');
const alphaBar  = document.getElementById('alpha-bar');
const content   = document.getElementById('content');
const overlay   = document.getElementById('overlay');
const loadBar   = document.getElementById('load-bar');
const loadMsg   = document.getElementById('load-msg');
const loadSub   = document.getElementById('load-sub');

// ── Load data ──
fetch('dict-data.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const total = parseInt(r.headers.get('Content-Length') || '0');
    if (!total) return r.json();
    // Stream progress
    const reader = r.body.getReader();
    const chunks = [];
    let received = 0;
    return new ReadableStream({
      start(ctrl) {
        function pump() {
          return reader.read().then(({done, value}) => {
            if (done) { ctrl.close(); return; }
            chunks.push(value);
            received += value.length;
            loadBar.style.width = Math.min(100, received/total*100).toFixed(1) + '%';
            ctrl.enqueue(value);
            return pump();
          });
        }
        return pump();
      }
    });
  })
  .then(stream => {
    if (stream instanceof ReadableStream) {
      return new Response(stream).json();
    }
    return stream;
  })
  .then(data => {
    WORDS = data;
    loadBar.style.width = '100%';
    loadMsg.textContent = '建立索引…';
    // Build map after a tick so the DOM updates
    setTimeout(() => {
      wordMap = new Map();
      for (let i = 0; i < WORDS.length; i++) {
        wordMap.set(WORDS[i][0].toLowerCase(), i);
      }
      buildAlphaBar();
      overlay.classList.add('hidden');
      searchBox.disabled = false;
      renderLetter('ALL');
    }, 20);
  })
  .catch(err => {
    loadMsg.textContent = '載入失敗：' + err.message;
    loadSub.textContent = '請確認 dict-data.json 存在於 Assets/webapp/ 目錄';
    loadBar.style.background = '#a1260d';
  });

// ── Build alphabet bar ──
function buildAlphaBar() {
  const ls = new Set();
  WORDS.forEach(w => ls.add(w[0][0].toUpperCase()));
  letters = [...ls].sort();
  letters.forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'alpha-btn'; btn.dataset.l = l; btn.textContent = l;
    btn.onclick = () => { setLetter(l); renderLetter(l); };
    alphaBar.appendChild(btn);
  });
  document.querySelector('.alpha-btn[data-l="ALL"]').onclick = () => { setLetter('ALL'); renderLetter('ALL'); };
}

function setLetter(l) {
  currentLetter = l;
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.toggle('active', b.dataset.l === l));
}

// ── Binary search: find first index where word[0].toLowerCase() >= key ──
function lowerBound(key) {
  let lo = 0, hi = WORDS.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (WORDS[mid][0].toLowerCase() < key) lo = mid + 1; else hi = mid;
  }
  return lo;
}

// ── Render ──
const MAX_DISPLAY = 500;

function renderLetter(letter) {
  searchBox.value = '';
  content.innerHTML = '';
  if (letter === 'ALL') {
    // Show a preview of each letter section (first 30 entries per letter)
    const groups = {};
    WORDS.forEach(w => {
      const l = w[0][0].toUpperCase();
      if (!groups[l]) groups[l] = [];
      if (groups[l].length < 30) groups[l].push(w);
    });
    letters.forEach(l => {
      content.appendChild(makeGroup(l, groups[l] || [], true));
    });
    const hint = document.createElement('div');
    hint.style.cssText = 'color:#555;text-align:center;padding:12px;font-size:11px';
    hint.textContent = '顯示每字母前 30 筆預覽。點擊字母按鈕或搜尋查看完整結果。';
    content.appendChild(hint);
  } else {
    const start = lowerBound(letter.toLowerCase());
    const group = [];
    for (let i = start; i < WORDS.length && WORDS[i][0][0].toUpperCase() === letter; i++) {
      group.push(WORDS[i]);
      if (group.length >= MAX_DISPLAY * 4) break;
    }
    const showing = Math.min(group.length, MAX_DISPLAY * 4);
    content.appendChild(makeGroup(letter + ' (' + showing + ' / ' + group.length + ')', group.slice(0, MAX_DISPLAY * 4)));
  }
  content.scrollTop = 0;
}

function makeGroup(title, rows, compact) {
  const sec = document.createElement('div');
  sec.className = 'letter-group';
  const h = document.createElement('div');
  h.className = 'letter-title'; h.textContent = title;
  sec.appendChild(h);
  rows.forEach(w => sec.appendChild(makeRow(w)));
  return sec;
}

function makeRow([en, ph, zh]) {
  const row = document.createElement('div');
  row.className = 'word-row';
  const eEl = document.createElement('span'); eEl.className = 'word-en'; eEl.textContent = en;
  const pEl = document.createElement('span'); pEl.className = 'word-ph'; pEl.textContent = ph ? '['+ph+']' : '';
  const zEl = document.createElement('span'); zEl.className = 'word-zh'; zEl.textContent = zh;
  row.appendChild(eEl); row.appendChild(pEl); row.appendChild(zEl);
  return row;
}

// ── Search ──
let debounce;
searchBox.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(doSearch, 120);
});

function doSearch() {
  const q = searchBox.value.trim().toLowerCase();
  if (!q) { setLetter('ALL'); renderLetter('ALL'); return; }
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
  content.innerHTML = '';

  let matches = [];
  const isZh = /[一-鿿]/.test(q);

  if (isZh) {
    // Chinese search: linear scan (unavoidable)
    for (let i = 0; i < WORDS.length && matches.length < MAX_DISPLAY; i++) {
      if (WORDS[i][2].includes(q)) matches.push(WORDS[i]);
    }
  } else {
    // English: binary search for prefix, then linear scan for contains
    const start = lowerBound(q);
    // Prefix matches first
    for (let i = start; i < WORDS.length && matches.length < MAX_DISPLAY; i++) {
      if (!WORDS[i][0].toLowerCase().startsWith(q)) break;
      matches.push(WORDS[i]);
    }
    // Then contains matches (scan nearby range)
    if (matches.length < MAX_DISPLAY) {
      for (let i = 0; i < WORDS.length && matches.length < MAX_DISPLAY; i++) {
        const lower = WORDS[i][0].toLowerCase();
        if (lower.startsWith(q)) continue; // already included
        if (lower.includes(q)) matches.push(WORDS[i]);
      }
    }
  }

  const count = document.createElement('div');
  count.id = 'result-count';
  count.textContent = matches.length >= MAX_DISPLAY
    ? `顯示前 ${MAX_DISPLAY} 筆（含「${q}」）` : `${matches.length} 筆結果`;
  content.appendChild(count);

  if (matches.length === 0) {
    const none = document.createElement('div');
    none.style.cssText = 'color:#555;padding:20px;text-align:center';
    none.textContent = 'No results for "' + searchBox.value.trim() + '"';
    content.appendChild(none);
  } else {
    const sec = document.createElement('div');
    sec.className = 'letter-group';
    matches.forEach(w => sec.appendChild(makeRow(w)));
    content.appendChild(sec);
  }
  content.scrollTop = 0;
}
</script>
</body>
</html>
