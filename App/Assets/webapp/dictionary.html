*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1e1e1e;color:#d4d4d4;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;font-size:13px}
body{display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:10px;padding:0 14px;height:40px;flex-shrink:0;background:#252526;border-bottom:1px solid #3e3e42}
#topbar a{color:#9cdcfe;text-decoration:none;font-size:12px;padding:3px 8px;border:1px solid #3e3e42;border-radius:4px}
#topbar a:hover{background:#2d2d30}
#topbar span{font-weight:600;color:#dcdcaa;font-size:13px}
#search-box{margin-left:auto;background:#2d2d30;color:#d4d4d4;border:1px solid #3e3e42;border-radius:4px;padding:4px 10px;font-size:12px;width:240px;outline:none}
#search-box:focus{border-color:#0e639c}
#search-box::placeholder{color:#555}
#alpha-bar{display:flex;flex-wrap:wrap;gap:2px;padding:6px 12px;background:#252526;border-bottom:1px solid #3e3e42;flex-shrink:0}
.alpha-btn{background:#2d2d30;color:#9cdcfe;border:1px solid #3e3e42;border-radius:3px;padding:2px 7px;font-size:11px;cursor:pointer}
.alpha-btn:hover,.alpha-btn.active{background:#0e639c;color:#fff;border-color:#0e639c}
#content{flex:1;overflow-y:auto;padding:8px 14px 24px;scrollbar-width:thin;scrollbar-color:#3e3e42 transparent}
#content::-webkit-scrollbar{width:6px}
#content::-webkit-scrollbar-thumb{background:#3e3e42;border-radius:3px}
.letter-group{margin-bottom:16px}
.letter-title{font-size:11px;font-weight:700;color:#6ca8d4;text-transform:uppercase;letter-spacing:1px;padding:4px 0 5px;border-bottom:1px solid #2d2d30;margin-bottom:4px}
.word-row{display:flex;align-items:baseline;padding:3px 6px;border-radius:3px}
.word-row:hover{background:#252526}
.word-en{color:#9cdcfe;font-size:12.5px;font-weight:500;min-width:200px;flex-shrink:0}
.word-zh{color:#a8a8a8;font-size:12px;line-height:1.4}
#no-result{color:#666;padding:20px;text-align:center}
.hidden{display:none}
</style>
</head>

// Deduplicate by lowercase english
const seen = new Set();
const WORDS = [];
for(const [en,zh] of RAW){
  const k = en.toLowerCase();
  if(!seen.has(k)){seen.add(k);WORDS.push([en,zh]);}
}
WORDS.sort((a,b)=>a[0].toLowerCase().localeCompare(b[0].toLowerCase()));

const letters = [...new Set(WORDS.map(w=>w[0][0].toUpperCase()))].sort();
const alphaBar = document.getElementById('alpha-bar');
const content = document.getElementById('content');
const searchBox = document.getElementById('search-box');
const noResult = document.getElementById('no-result');

letters.forEach(l=>{
  const btn = document.createElement('button');
  btn.className='alpha-btn'; btn.dataset.l=l; btn.textContent=l;
  btn.onclick=()=>jumpTo(l,btn);
  alphaBar.appendChild(btn);
});

function jumpTo(letter, btn){
  document.querySelectorAll('.alpha-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  searchBox.value='';
  renderAll('');
  const sec=document.getElementById('grp-'+letter);
  if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});
}

document.querySelector('.alpha-btn[data-l="ALL"]').onclick=()=>{
  document.querySelectorAll('.alpha-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.alpha-btn[data-l="ALL"]').classList.add('active');
  searchBox.value=''; renderAll('');
};

function renderAll(filter){
  content.innerHTML='';
  const q=filter?filter.trim().toLowerCase():'';
  let anyVisible=false;
  if(q){
    const matches=WORDS.filter(([en,zh])=>en.toLowerCase().includes(q)||zh.includes(q));
    if(matches.length===0){noResult.classList.remove('hidden');content.classList.add('hidden');return;}
    noResult.classList.add('hidden');content.classList.remove('hidden');
    const sec=document.createElement('div');
    sec.className='letter-group';
    const title=document.createElement('div');
    title.className='letter-title';
    title.textContent=`Search results (${matches.length})`;
    sec.appendChild(title);
    matches.forEach(([en,zh])=>sec.appendChild(makeRow(en,zh)));
    content.appendChild(sec);
    return;
  }
  noResult.classList.add('hidden');content.classList.remove('hidden');
  const groups={};
  WORDS.forEach(([en,zh])=>{
    const l=en[0].toUpperCase();
    if(!groups[l])groups[l]=[];
    groups[l].push([en,zh]);
  });
  Object.keys(groups).sort().forEach(l=>{
    anyVisible=true;
    const sec=document.createElement('div');
    sec.className='letter-group';
    sec.id='grp-'+l;
    const title=document.createElement('div');
    title.className='letter-title';
    title.textContent=l+' ('+groups[l].length+')';
    sec.appendChild(title);
    groups[l].forEach(([en,zh])=>sec.appendChild(makeRow(en,zh)));
    content.appendChild(sec);
  });
}

function makeRow(en,zh){
  const row=document.createElement('div');
  row.className='word-row';
  const enEl=document.createElement('span');
  enEl.className='word-en'; enEl.textContent=en;
  const zhEl=document.createElement('span');
  zhEl.className='word-zh'; zhEl.textContent=zh;
  row.appendChild(enEl); row.appendChild(zhEl);
  return row;
}

let debounce;
searchBox.addEventListener('input',()=>{
  clearTimeout(debounce);
  debounce=setTimeout(()=>{
    document.querySelectorAll('.alpha-btn').forEach(b=>b.classList.remove('active'));
    renderAll(searchBox.value);
  },150);
});

document.querySelector('.alpha-btn[data-l="ALL"]').classList.add('active');
renderAll('');
