const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
const searchBox = document.getElementById('search-box');
const noResult = document.getElementById('no-result');

function buildSidebar() {
  DATA.forEach(cat => {
    const a = document.createElement('div');
    a.className = 'cat-link';
    a.textContent = cat.cat;
    a.dataset.id = cat.id;
    a.onclick = () => {
      document.querySelectorAll('.cat-link').forEach(x=>x.classList.remove('active'));
      a.classList.add('active');
      searchBox.value = '';
      renderAll();
      const sec = document.getElementById('sec-'+cat.id);
      if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});
    };
    sidebar.appendChild(a);
  });
}

function renderAll(filter) {
  content.innerHTML = '';
  let anyVisible = false;
  const q = filter ? filter.trim().toLowerCase() : '';
  DATA.forEach(cat => {
    const fns = q ? cat.fns.filter(f =>
      f.sig.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q)) : cat.fns;
    if(fns.length === 0) return;
    anyVisible = true;
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 'sec-'+cat.id;
    const title = document.createElement('div');
    title.className = 'sec-title';
    title.textContent = cat.cat;
    sec.appendChild(title);
    fns.forEach(f => {
      const item = document.createElement('div');
      item.className = 'fn-item';
      const sig = document.createElement('div');
      sig.className = 'fn-sig';
      sig.textContent = f.sig;
      item.appendChild(sig);
      if(f.desc) {
        const desc = document.createElement('div');
        desc.className = 'fn-desc';
        desc.textContent = f.desc;
        item.appendChild(desc);
      }
      if(f.note) {
        const note = document.createElement('div');
        note.className = 'fn-note';
        note.textContent = f.note;
        item.appendChild(note);
      }
      sec.appendChild(item);
    });
    content.appendChild(sec);
  });
  noResult.classList.toggle('hidden', anyVisible);
  content.classList.toggle('hidden', !anyVisible);
}

let debounceTimer;
searchBox.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    document.querySelectorAll('.cat-link').forEach(x=>x.classList.remove('active'));
    renderAll(searchBox.value);
  }, 120);
});

buildSidebar();
renderAll();
</script>
</body>
</html>
